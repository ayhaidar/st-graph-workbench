<div
    id="container"
    class="st-graph-workbench container"
    data-theme="light"
    tabindex="0"
>
    <!------------------------------------->
    <!--------- Cytoscape Container ------->
    <!------------------------------------->
    <div id="cy" class="cy"></div>
    <div id="expansionBadges" class="expansion-badges"></div>
    <div id="graphContextMenu" class="graph-context-menu" role="menu" hidden>
        <button
            id="graphContextMenuExpand"
            class="graph-context-menu__item"
            type="button"
            role="menuitem"
        >
            Expand node
        </button>
    </div>

    <!------------------------------------->
    <!----------- Command Bar ------------->
    <!------------------------------------->
    <div id="graphTopbar" class="graph-topbar" aria-label="Graph Commands">
        <div id="searchPanel" class="search-panel" hidden>
            <select
                id="graphSearchMode"
                class="search-panel__select"
                title="Search Mode"
                aria-label="Search Mode"
            >
                <option value="text">Text</option>
                <option value="node-label">Node label</option>
                <option value="edge-label">Edge label</option>
                <option value="property">Property</option>
                <option value="selector">Selector</option>
            </select>
            <input
                id="graphSearchInput"
                class="search-panel__input"
                type="search"
                placeholder="Search graph"
                aria-label="Search graph"
            />
            <button
                id="graphSearchApply"
                class="search-panel__button"
                title="Apply Search"
                aria-label="Apply Search"
                type="button"
            >
                <!-- prettier-ignore -->
                <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
            </button>
            <button
                id="graphSearchClear"
                class="search-panel__button"
                title="Clear Search"
                aria-label="Clear Search"
                type="button"
            >
                <!-- prettier-ignore -->
                <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
            </button>
            <span
                id="graphSearchStatus"
                class="search-panel__status"
                aria-live="polite"
            ></span>
        </div>

        <div
            id="canvasModeControls"
            class="canvas-mode-controls"
            role="group"
            aria-label="Canvas drag mode"
            hidden
        >
            <button
                id="canvasModePan"
                class="canvas-mode-controls__button"
                type="button"
                title="Pan graph"
                aria-pressed="false"
            >
                Pan
            </button>
            <button
                id="canvasModeBox"
                class="canvas-mode-controls__button"
                type="button"
                title="Select nodes with a box"
                aria-pressed="true"
            >
                Box select
            </button>
        </div>

        <div
            id="selectionStatus"
            class="selection-status"
            data-has-selection="false"
            data-mode="single"
            aria-live="polite"
        >
            <span id="selectionStatusMode" class="selection-status__mode">
                Single
            </span>
            <span id="selectionStatusCount" class="selection-status__count">
                0 selected
            </span>
        </div>

        <div id="graphStats" class="graph-stats">
            <button
                id="graphStatsButton"
                class="graph-stats__button"
                title="Show Graph Counts"
                aria-label="Show Graph Counts"
                type="button"
            >
                <span>
                    <strong id="graphStatsButtonNodes">0</strong>
                    nodes
                </span>
                <span class="graph-stats__divider" aria-hidden="true"></span>
                <span>
                    <strong id="graphStatsButtonEdges">0</strong>
                    edges
                </span>
            </button>
            <div
                id="graphStatsDialog"
                class="graph-stats-dialog"
                aria-label="Graph Counts"
                hidden
            >
                <div class="graph-stats-dialog__header">
                    <strong>Graph counts</strong>
                    <button
                        id="graphStatsClose"
                        class="graph-stats-dialog__close"
                        title="Close Graph Counts"
                        aria-label="Close Graph Counts"
                        type="button"
                    >
                        <!-- prettier-ignore -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg>
                    </button>
                </div>
                <dl class="graph-stats-dialog__grid">
                    <dt>Shown nodes</dt>
                    <dd id="graphStatsShownNodes">0</dd>
                    <dt>Hidden nodes</dt>
                    <dd id="graphStatsHiddenNodes">0</dd>
                    <dt>Total nodes</dt>
                    <dd id="graphStatsTotalNodes">0</dd>
                    <dt>Expanded nodes</dt>
                    <dd id="graphStatsExpandedNodes">0</dd>
                    <dt>Not expanded nodes</dt>
                    <dd id="graphStatsNotExpandedNodes">0</dd>
                    <dt>Shown edges</dt>
                    <dd id="graphStatsShownEdges">0</dd>
                    <dt>Hidden edges</dt>
                    <dd id="graphStatsHiddenEdges">0</dd>
                    <dt>Total edges</dt>
                    <dd id="graphStatsTotalEdges">0</dd>
                </dl>
            </div>
        </div>

        <div
            id="progressiveLoading"
            class="progressive-loading"
            aria-label="Progressive loading"
            hidden
        >
            <span
                id="progressiveLoadingStatus"
                class="progressive-loading__status"
                aria-live="polite"
            ></span>
            <button
                id="progressiveLoadingButton"
                class="progressive-loading__button"
                title="Load more records"
                aria-label="Load more records"
                type="button"
            >
                <!-- prettier-ignore -->
                <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-200v-240H200v-80h240v-240h80v240h240v80H520v240h-80Z"/></svg>
                <span>Load more</span>
            </button>
        </div>

        <div id="toolbox" class="toolbox" aria-label="Graph Toolbox">
            <div
                id="nodeActions"
                class="toolbox__group toolbox__group--inline"
                aria-label="Node Actions"
                data-expanded="false"
            >
                <button
                    id="nodeActionsRemove"
                    class="toolbox__button"
                    title="Remove Nodes"
                    aria-label="Remove Nodes"
                    type="button"
                >
                    <!-- prettier-ignore -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                </button>
                <button
                    id="nodeActionsExpand"
                    class="toolbox__button"
                    title="Expand Node"
                    aria-label="Expand Node"
                    type="button"

                    <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon toolbox__icon-expand" viewBox="0 -960 960 960"><path d="M480-80 310-250l57-57 73 73v-166h80v165l72-73 58 58L480-80ZM250-310 80-480l169-169 57 57-72 72h166v80H235l73 72-58 58Zm460 0-57-57 73-73H560v-80h165l-73-72 58-58 170 170-170 170ZM440-560v-166l-73 73-57-57 170-170 170 170-57 57-73-73v166h-80Z"/></svg>
                    <!-- prettier-ignore -->

                </button>
            </div>

            <details id="exploreControls" class="toolbox__group toolbox__menu">
                <summary class="toolbox__menu-trigger" title="Explore">
                    <!-- prettier-ignore -->
                    <svg class="toolbox__menu-icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-80v-160h80v160h-80Zm0-640v-160h80v160h-80ZM80-440v-80h160v80H80Zm640 0v-80h160v80H720ZM232-176l-56-56 112-112 56 56-112 112Zm440-440-56-56 112-112 56 56-112 112Zm56 440L616-288l56-56 112 112-56 56ZM288-616 176-728l56-56 112 112-56 56ZM480-320q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Z"/></svg>

                        id="nodeActionsNeighbors"
                        class="toolbox__button"
                        title="Show Neighbors"
                        aria-label="Show Neighbors"
                        type="button"
                    >
                        <!-- prettier-ignore -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="M440-80v-160h80v160h-80Zm0-640v-160h80v160h-80ZM80-440v-80h160v80H80Zm640 0v-80h160v80H720ZM232-176l-56-56 112-112 56 56-112 112Zm440-440-56-56 112-112 56 56-112 112Zm56 440L616-288l56-56 112 112-56 56ZM288-616 176-728l56-56 112 112-56 56ZM480-320q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Z"/></svg>
                    </button>
                    <button

                        title="Show Incoming"
                        aria-label="Show Incoming"
                        type="button"
                    >
                        <!-- prettier-ignore -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="M440-200v-288L312-360l-56-56 224-224 224 224-56 56-128-128v288h-80ZM200-680v-80h560v80H200Z"/></svg>
                    </button>
                    <button
                        id="nodeActionsOutgoing"
                        class="toolbox__button"
                        title="Show Outgoing"
                        aria-label="Show Outgoing"
                        type="button"
                    >
                        <!-- prettier-ignore -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="M440-760v288L312-600l-56 56 224 224 224-224-56-56-128 128v-288h-80ZM200-200v-80h560v80H200Z"/></svg>
                    </button>
                </div>
            </details>

            <details
                id="selectionControls"
                class="toolbox__group toolbox__menu"
            >
                <summary class="toolbox__menu-trigger" title="Selection">
                    <!-- prettier-ignore -->
                    <svg class="toolbox__menu-icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M320-240h320v-80H320v80Zm0-200h320v-80H320v80Zm0-200h320v-80H320v80ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Z"/></svg>
                    <span class="toolbox__menu-label">Selection</span>

                <div class="toolbox__menu-content">
                    <label class="selection-details-toggle">
                        <input
                            id="selectionShowDetails"
                            type="checkbox"
                            checked
                        />

                    </label>
                    <div
                        id="connectedDragControls"
                        class="connected-drag-controls"
                        hidden
                    >
                        <label class="selection-details-toggle">
                            <input id="connectedDragEnabled" type="checkbox" />
                            Move connected nodes
                        </label>
                        <label
                            class="connected-drag-depth"
                            for="connectedDragDepth"
                        >
                            Connected depth
                            <select id="connectedDragDepth">
                                <option value="1">1 hop</option>
                                <option value="2">2 hops</option>
                                <option value="3">3 hops</option>
                            </select>
                        </label>
                        <p
                            id="connectedDragStatus"
                            class="connected-drag-status"
                            role="status"
                            aria-live="polite"
                            hidden
                        ></p>
                    </div>
                    <button
                        id="selectionSelectAll"
                        class="toolbox__button"
                        title="Select All Visible"
                        aria-label="Select All Visible"
                        type="button"
                    >
                        <!-- prettier-ignore -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="M320-240h320v-80H320v80Zm0-200h320v-80H320v80Zm0-200h320v-80H320v80ZM200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Z"/></svg>
                    </button>
                    <button
                        id="selectionClear"
                        class="toolbox__button"
                        title="Clear Selection"
                        aria-label="Clear Selection"
                        type="button"
                    >
                        <!-- prettier-ignore -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="M120-120v-80h720v80H120Zm160-160L120-440l56-56 160 160-56 56Zm400 0-56-56 160-160 56 56-160 160ZM320-560 160-720l56-56 160 160-56 56Zm320 0-56-56 160-160 56 56-160 160Z"/></svg>
                    </button>
                    <button
                        id="selectionFocus"
                        class="toolbox__button"
                        title="Focus Selected"
                        aria-label="Focus Selected"
                        type="button"
                    >
                        <!-- prettier-ignore -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="M440-80v-120h80v120h-80Zm240-120v-80h80v-80h80v160H680ZM120-200v-160h80v80h80v80H120Zm360-120q-66 0-113-47t-47-113q0-66 47-113t113-47q66 0 113 47t47 113q0 66-47 113t-113 47Zm280-280v-80h-80v-80h160v160h-80ZM120-600v-160h160v80h-80v80h-80Zm320-160v-120h80v120h-80Z"/></svg>
                    </button>
                    <button
                        id="selectionHideUnselected"
                        class="toolbox__button"
                        title="Hide Unselected"
                        aria-label="Hide Unselected"

                    >

                    </button>
                    <button
                        id="selectionRestore"
                        class="toolbox__button"
                        title="Restore Hidden"
                        aria-label="Restore Hidden"
                        type="button"
                    >
                        <!-- prettier-ignore -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="M480-200q-146 0-266-81.5T40-500q26-66 73-120.5T222-714l-94-94 56-56 680 680-56 56-110-110q-49 19-103 28.5T480-200Zm0-600q146 0 266 81.5T920-500q-18 45-47.5 85T805-342L668-479q-8-71-62.5-116T480-640q-23 0-44 5t-39 15L296-721q84-79 184-79Z"/></svg>
                    </button>
                </div>
            </details>

            <details
                id="crudControls"
                class="toolbox__group toolbox__menu"
                hidden
            >
                <summary class="toolbox__menu-trigger" title="Data">
                    <!-- prettier-ignore -->
                    <svg class="toolbox__menu-icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M480-160q-134 0-227-42t-93-98v-360q0-56 93-98t227-42q134 0 227 42t93 98v360q0 56-93 98t-227 42Zm0-480q97 0 167-20t70-40q0-20-70-40t-167-20q-97 0-167 20t-70 40q0 20 70 40t167 20Zm0 200q90 0 160-18t80-38v-104q-43 20-106 30t-134 10q-71 0-134-10t-106-30v104q10 20 80 38t160 18Zm0 200q90 0 160-18t80-38v-104q-43 20-106 30t-134 10q-71 0-134-10t-106-30v104q10 20 80 38t160 18Z"/></svg>

                    </button>
                </div>
            </details>

            <details
                id="editControls"
                class="toolbox__group toolbox__menu"
                hidden
            >
                <summary class="toolbox__menu-trigger" title="Edit">
                    <!-- prettier-ignore -->
                    <svg class="toolbox__menu-icon" viewBox="0 -960 960 960" aria-hidden="true"><path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t27 18l55 56q12 11 17 26t5 30q0 16-5.5 30.5T818-647L290-120H120Zm584-584-57-57 57 57Zm-85 85-28-29 57 57-29-28Z"/></svg>
                    <span class="toolbox__menu-label">Edit</span>
                </summary>
                <div class="toolbox__menu-content toolbox__menu-content--wide">
                    <button
                        id="editAddNode"
                        class="toolbox__button"
                        title="Add Browser Node"
                        aria-label="Add Browser Node"
                        type="button"
                    >
                        <!-- prettier-ignore -->
                        <svg xmlns="http://www.w3.org/2000/svg" class="toolbox__icon" viewBox="0 -960 960 960"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Zm40 320q-75 0-140.5-28.5t-114-77q-48.5-48.5-77-114T120-480q0-75 28.5-140.5t77-114q48.5-48.5 114-77T480-840q75 0 140.5 28.5t114 77q48.5 48.5 77 114T840-480q0 75-28.5 140.5t-77 114q-48.5 48.5-114 77T480-120Z"/></svg>

                    <button
                        id="editConnectSelected"
                        class="toolbox__button"
                        title="Connect Two Selected Nodes"
                        aria-label="Connect Two Selected Nodes"
                        type="button"
